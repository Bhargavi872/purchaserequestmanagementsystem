# yaml-language-server: $schema=./values.schema.json

global:
  domain: <cluster-domain>
  imagePullSecret:
    name: docker-registry
  image:
    registry: <your-container-registry-server>
    tag: latest
srv:
  bindings:
    db:
      serviceInstanceName: hana
  image:
    repository: zpurchaserequestmanagementsystem1-srv
  resources:
    limits:
      ephemeral-storage: 1G
      memory: 500M
    requests:
      ephemeral-storage: 1G
      cpu: 500m
      memory: 500M
  health:
    liveness:
      path: /health
    readiness:
      path: /health
hana-deployer:
  image:
    repository: zpurchaserequestmanagementsystem1-hana-deployer
  bindings:
    hana:
      serviceInstanceName: hana
  resources:
    limits:
      cpu: 2000m
      memory: 1G
    requests:
      cpu: 1000m
      memory: 1G
hana:
  serviceOfferingName: hana
  servicePlanName: hdi-shared
